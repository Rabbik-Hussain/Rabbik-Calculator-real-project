<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="night-mode">

    <div class="calculator">
        <!-- Mode Switch (Top Bar) -->
        <!-- Mode Switch (Top Bar) -->
<div class="mode-toggle-container">
    <span class="mode-label">Mode:</span>
    <label class="switch">
        <input type="checkbox" id="mode-toggle" onchange="toggleTheme()">
        <span class="slider round">
             <!-- ডে মোডে সূর্য এবং নাইট মোডে চাঁদের আইকন -->
            <span class="icon sun-icon">☀️</span>
            <span class="icon moon-icon">🌙</span>
        </span>
    </label>
</div>

        <!-- Display -->
        <div class="display-container">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>

        <!-- Keypad -->
        <div class="keypad">
            <!-- Row 1 -->
            <button class="btn btn-ac" onclick="clearAll()">AC</button>
            <button class="btn btn-del" onclick="deleteDigit()">DEL</button>
            <button class="btn btn-bracket" onclick="appendCharacter('(')">(</button>
            <button class="btn btn-bracket" onclick="appendCharacter(')')">)</button>

            <!-- Row 2 -->
            <button class="btn btn-number" onclick="appendCharacter('7')">7</button>
            <button class="btn btn-number" onclick="appendCharacter('8')">8</button>
            <button class="btn btn-number" onclick="appendCharacter('9')">9</button>
            <button class="btn btn-operator" onclick="appendCharacter('÷')">÷</button>

            <!-- Row 3 -->
            <button class="btn btn-number" onclick="appendCharacter('4')">4</button>
            <button class="btn btn-number" onclick="appendCharacter('5')">5</button>
            <button class="btn btn-number" onclick="appendCharacter('6')">6</button>
            <button class="btn btn-operator" onclick="appendCharacter('×')">×</button>

            <!-- Row 4 -->
            <button class="btn btn-number" onclick="appendCharacter('1')">1</button>
            <button class="btn btn-number" onclick="appendCharacter('2')">2</button>
            <button class="btn btn-number" onclick="appendCharacter('3')">3</button>
            <button class="btn btn-operator" onclick="appendCharacter('-')">-</button>

            <!-- Row 5 -->
            <button class="btn btn-number" onclick="appendCharacter('0')">0</button>
            <button class="btn btn-number" onclick="appendCharacter('.')">.</button>
            <button class="btn btn-operator" onclick="appendCharacter('%')">%</button>
            <button class="btn btn-operator" onclick="appendCharacter('+')">+</button>

            <!-- Row 6 -->
            <button class="btn btn-pm" onclick="toggleSign()">+/−</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
